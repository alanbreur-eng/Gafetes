            display: block;

            .print-hide { display: none; }

    <button onclick="window.print()" class="print-hide bg-[#0A1F44] text-[#D4AF37] text-xs font-bold uppercase tracking-wide px-4 py-2 rounded shadow hover:opacity-90 fuente-datos">
        Imprimir / Guardar como PDF
    </button>

    <script>
        function cargarFoto(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;
            const lector = new FileReader();
            lector.onload = function(e) {
                document.getElementById('foto-preview').src = e.target.result;
                document.getElementById('foto-preview').classList.remove('hidden');
                document.getElementById('foto-placeholder').classList.add('hidden');
            };
            lector.readAsDataURL(archivo);
        }
    </script>

</body>
</html>
